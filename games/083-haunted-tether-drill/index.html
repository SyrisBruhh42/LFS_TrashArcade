<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted Tether Drill</title>
    <style>
        body { margin: 0; padding: 0; background: #111; color: #eee; overflow: hidden; font-family: monospace; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        canvas { max-width: 100%; max-height: 100%; display: block; box-shadow: 0 0 20px #000; }
        .back-link { position: absolute; top: 10px; left: 10px; color: #65bb98; text-decoration: none; font-size: 16px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; border: 1px solid #65bb98; z-index: 10; }
        #options-button { position:fixed; top:10px; right:10px; }
        button { min-height:44px; padding:8px 14px; font:inherit; cursor:pointer; }
        button:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid #65bb98; outline-offset:3px; }
        dialog { color:#eee; background:#17251f; border:2px solid #65bb98; width:min(90vw,480px); max-height:85vh; box-sizing:border-box; overflow:auto; touch-action:pan-y; }
        dialog::backdrop { background:#000b; }
        #options-fields { display:flex; flex-direction:column; gap:12px; }
        #options-fields label { display:flex; justify-content:space-between; align-items:center; min-height:44px; gap:12px; }
        #options-fields input { min-height:32px; }
    </style>
</head>
<body>
    <div id="game-container">
        <a href="../../index.html" class="back-link">Back to Arcade</a>
        <canvas id="gameCanvas" tabindex="0"></canvas>
    </div>
    <button id="options-button" type="button">Options</button>
    <dialog id="options-dialog" aria-labelledby="options-title">
        <h2 id="options-title">Options — game paused</h2>
        <p>Tab or Up/Down to move. Left/Right adjusts values.</p>
        <div id="options-fields"></div>
    </dialog>
    <script defer src="./game.js"></script>
</body>
</html>
