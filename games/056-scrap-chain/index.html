<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scrap Chain</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #eee;
      font-family: monospace;
      overflow: hidden;
      touch-action: none;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      background-color: #222;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.8);
      z-index: 10;
    }
    .ui-layer.active {
      display: flex;
    }
    h1 {
      color: #6c9b81;
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #6c9b81;
    }
    h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      margin: 0.5rem 0;
      text-align: center;
      max-width: 80%;
    }
    button {
      margin-top: 2rem;
      padding: 1rem 2rem;
      font-size: 1.5rem;
      background: #6c9b81;
      color: #111;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-family: inherit;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #8ecfbd;
    }
    a {
      color: #aaa;
      margin-top: 1.5rem;
      text-decoration: none;
    }
    a:hover {
      color: #fff;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      display: none;
    }
    #hud.active {
      display: block;
    }
    .hud-stat {
      position: absolute;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
      padding: 10px;
    }
    #scoreDisplay { top: 10px; left: 10px; }
    #highScoreDisplay { top: 10px; right: 10px; text-align: right; }

    #touchControls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: none;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 5;
    }
    .touch-btn {
      width: 80px;
      height: 80px;
      background: rgba(108, 155, 129, 0.4);
      border: 2px solid rgba(108, 155, 129, 0.8);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      color: white;
      font-weight: bold;
    }
    #joystickZone {
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      position: relative;
    }
    #joystickKnob {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      position: absolute;
      top: 50px;
      left: 50px;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="scoreDisplay" class="hud-stat">Score: 0</div>
    <div id="dashCooldownDisplay" class="hud-stat" style="top: 40px; left: 10px; color: #aaa; font-size: 1rem;">DASH: READY</div>
    <div id="comboDecayBar" class="hud-stat" style="top: 70px; left: 10px; color: #f5ca53; font-size: 1rem;">COMBO: 1.0x (100%)</div>
    <div id="highScoreDisplay" class="hud-stat">Best: 0</div>
  </div>

  <div id="touchControls">
    <div id="joystickZone"><div id="joystickKnob"></div></div>
    <div id="btnDash" class="touch-btn" style="background: rgba(200, 100, 100, 0.4); border-color: rgba(200, 100, 100, 0.8);">DASH</div>
    <div id="btnDetonate" class="touch-btn">DETONATE</div>
  </div>

    <div id="fpsCounter" style="position:absolute; top:5px; right:5px; color:#0f0; z-index:100; font-family:monospace; display:none; pointer-events:none;">FPS: 60</div>

  <div id="screenSettings" class="ui-layer" style="overflow-y:auto; background: rgba(0,0,0,0.95);">
    <h2>SETTINGS</h2>
    <div style="display:flex; flex-direction:column; gap:10px; text-align:left; max-width:400px; width:100%; padding:20px; box-sizing:border-box; background:#222; border-radius:10px;">
        <label style="display:flex; justify-content:space-between;">Master Mute: <input type="checkbox" id="setMute"></label>
        <label style="display:flex; justify-content:space-between;">Music Vol: <input type="range" id="setMusicVol" min="0" max="1" step="0.1"></label>
        <label style="display:flex; justify-content:space-between;">SFX Vol: <input type="range" id="setSfxVol" min="0" max="1" step="0.1"></label>
        <label style="display:flex; justify-content:space-between;">Screen Shake: <select id="setShake"><option value="1">100%</option><option value="0.5">50%</option><option value="0">Off</option></select></label>
        <label style="display:flex; justify-content:space-between;">Particle Density: <select id="setParticles"><option value="1">High</option><option value="0.5">Low</option></select></label>
        <label style="display:flex; justify-content:space-between;">High Contrast: <input type="checkbox" id="setContrast"></label>
        <label style="display:flex; justify-content:space-between;">Show FPS: <input type="checkbox" id="setFps"></label>
        <label style="display:flex; justify-content:space-between;">Touch Controls: <select id="setTouch"><option value="auto">Auto</option><option value="always">Always</option><option value="off">Off</option></select></label>
        <label style="display:flex; justify-content:space-between;">Handedness: <select id="setHand"><option value="right">Right</option><option value="left">Left</option></select></label>

        <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
            <button id="btnExportSave" style="font-size:1rem; padding:0.5rem; margin-top:0;">Export Save</button>
            <button id="btnImportSave" style="font-size:1rem; padding:0.5rem; margin-top:0;">Import Save</button>
        </div>
        <textarea id="saveTextarea" style="width:100%; height:60px; margin-top:10px; display:none; background:#111; color:#eee; border:1px solid #6c9b81;"></textarea>

        <div style="display:flex; gap:10px; margin-top:10px; justify-content:center;">
            <button id="btnResetSave1" style="font-size:1rem; padding:0.5rem; margin-top:0; background:#a44;">Reset Save</button>
            <button id="btnResetSave2" style="font-size:1rem; padding:0.5rem; margin-top:0; background:#d33; display:none;">Confirm Reset</button>
        </div>
    </div>
    <button id="btnCloseSettings" style="margin-top:20px;">CLOSE</button>
  </div>

  <div id="screenTitle" class="ui-layer active">
    <h1>Scrap Chain</h1>
    <p>Alchemy/Chain-Reaction Puzzle Action</p>
    <p>WASD/Arrows to move, Space to detonate.</p>
    <button id="btnStart">PLAY</button>
    <div id="milestonesTitle" style="display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:center;"></div>
    <button id="btnSettingsTitle" style="margin-top:10px; padding:0.5rem 1rem; font-size:1rem;">Settings</button>
    <a href="../../index.html">Back to Arcade</a>
  </div>

  <div id="screenPaused" class="ui-layer">
    <h2>PAUSED</h2>
    <button id="btnResume">RESUME</button>
    <button id="btnSettingsPaused" style="margin-top:10px; padding:0.5rem 1rem; font-size:1rem;">Settings</button>
    <a href="../../index.html">Back to Arcade</a>
  </div>

  <div id="screenUpgrade" class="ui-layer">
    <h2>UPGRADE DRAFT</h2>
    <div id="upgradeChoices" style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;"></div>
  </div>

  <div id="screenGameOver" class="ui-layer">
    <h2>GAME OVER</h2>
    <p id="finalScore">Score: 0</p>
    <div id="milestonesGameOver" style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; justify-content:center;"></div>
    <button id="btnRestart">RESTART</button>
    <a href="../../index.html">Back to Arcade</a>
  </div>
</div>

<script defer src="ui.js"></script>
<script defer src="world.js"></script>
<script defer src="enemies.js"></script>
<script defer src="bosses.js"></script>
<script defer src="vfx.js"></script>
<script defer src="progression.js"></script>
<script defer src="audio.js"></script>
<script defer src="game.js"></script>
</body>
</html>
