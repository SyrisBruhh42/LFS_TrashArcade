<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Drill Samurai</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --text-main: #c5c6c7;
      --accent: #a0efb8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; background: var(--bg-color); color: var(--text-main); font-family: 'Courier New', Courier, monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 0 20px rgba(160, 239, 184, 0.2); }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>
  <script defer src="./game.js"></script>
</body>
</html>
