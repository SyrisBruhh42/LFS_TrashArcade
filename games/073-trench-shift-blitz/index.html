<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trench Shift Blitz</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050a15;
      overflow: hidden;
      touch-action: none;
      font-family: monospace;
    }
    #gameContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script defer src="./game.js"></script>
  <script defer src="./bosses.js"></script>
  <script defer src="./progression.js"></script>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
  </div>
</body>
</html>
