<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scrapheap Heist</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; touch-action: none; user-select: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer"></div>
    </div>
    <script defer src="./game_utils.js"></script>
    <script defer src="./audio.js"></script>
    <script defer src="./player.js"></script>
    <script defer src="./enemies.js"></script>
    <script defer src="./level.js"></script>
    <script defer src="./ui.js"></script>
    <script>
        const LOGICAL_WIDTH = 1920;
        const LOGICAL_HEIGHT = 1080;

        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.container = document.getElementById('game-container');
                this.uiLayer = document.getElementById('ui-layer');

                this.saveManager = new SaveManager();
                this.inputManager = new InputManager(this.canvas, this.uiLayer);
                this.audioEngine = new AudioEngine(this.saveManager);

                // Initialize audio on first interaction
                const initAudio = () => {
                    this.audioEngine.resume();
                    window.removeEventListener('keydown', initAudio);
                    window.removeEventListener('pointerdown', initAudio);
                };
                window.addEventListener('keydown', initAudio);
                window.addEventListener('pointerdown', initAudio);

                this.levelManager = new LevelManager();
                this.player = null;
                this.enemies = [];
                this.shakeTime = 0;
                this.shakeIntensity = 0;

                this.level = 1;

                this.uiManager = new UIManager(this);

                // Expose engine to global for quick access from entities (like shake)
                window.engine = this;

                this.lastTime = 0;
                this.running = false;
                this.state = '';

                this.setupResizeObserver();

                window.addEventListener('blur', () => {
                    if (this.state === 'PLAYING') this.changeState('PAUSED');
                });
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && this.state === 'PLAYING') this.changeState('PAUSED');
                });
            }

            changeState(newState) {
                this.state = newState;
                this.uiManager.setState(newState);
            }

            startGame() {
                this.levelManager.score = 0;
                this.startLevel(1);
                this.changeState('PLAYING');
            }

            setupResizeObserver() {
                const resizeObserver = new ResizeObserver(entries => {
                    for (let entry of entries) {
                        const { width, height } = entry.contentRect;
                        this.handleResize(width, height);
                    }
                });
                resizeObserver.observe(this.container);
                this.handleResize(this.container.clientWidth, this.container.clientHeight);
            }

            handleResize(width, height) {
                const scale = Math.min(width / LOGICAL_WIDTH, height / LOGICAL_HEIGHT);
                this.canvas.width = LOGICAL_WIDTH;
                this.canvas.height = LOGICAL_HEIGHT;
                this.canvas.style.width = `${LOGICAL_WIDTH * scale}px`;
                this.canvas.style.height = `${LOGICAL_HEIGHT * scale}px`;
                this.scale = scale;
            }

            start() {
                this.running = true;
                this.changeState('TITLE');
                this.lastTime = performance.now();
                requestAnimationFrame(this.loop.bind(this));
            }

            loop(now) {
                if (!this.running) return;

                let dt = (now - this.lastTime) / 1000;
                dt = Math.min(dt, 0.1);
                this.lastTime = now;

                this.update(dt);
                this.draw(this.ctx);

                this.inputManager.clearJustPressed();
                requestAnimationFrame(this.loop.bind(this));
            }

            shakeScreen(intensity) {
                if (this.saveManager.data.options.screenShake === 0) return;
                this.shakeTime = 0.2;
                this.shakeIntensity = intensity * this.saveManager.data.options.screenShake;
            }

            startLevel(levelNum) {
                this.level = levelNum;
                const spawn = this.levelManager.generateLevel(this.level);
                this.player = new Player(spawn.px, spawn.py);
                this.enemies = this.levelManager.enemies;
            }

            update(dt) {
                if (this.state === 'PLAYING') {
                    if (this.inputManager.justPressedActions.pause) {
                        this.changeState('PAUSED');
                        return;
                    }

                    if (this.shakeTime > 0) {
                        this.shakeTime -= dt;
                    }

                    if (this.player) {
                        this.player.update(dt, this.inputManager, this.audioEngine);

                        for (let enemy of this.enemies) {
                            enemy.update(dt, this.player, this.audioEngine);
                        }

                        const levelComplete = this.levelManager.update(dt, this.player, this.audioEngine);
                        if (levelComplete) {
                            this.startLevel(this.level + 1);
                        }

                        if (this.player.health <= 0) {
                            this.player = null;
                            this.audioEngine.playGameOver();

                            // Save stats
                            const data = this.saveManager.data;
                            data.totalGamesPlayed++;
                            data.totalScoreAccumulated += this.levelManager.score;
                            if (this.levelManager.score > data.highScore) {
                                data.highScore = this.levelManager.score;
                            }
                            if (this.level > data.bestWaveOrCombo) {
                                data.bestWaveOrCombo = this.level;
                            }
                            this.saveManager.save();

                            this.changeState('GAME_OVER');
                        }
                    }
                } else if (this.state === 'GAME_OVER' || this.state === 'TITLE') {
                    // Start game on interact key
                    if (this.inputManager.justPressedActions.interact && !this.uiManager.optionsOpen) {
                        if (this.state === 'TITLE') {
                            this.startGame();
                        }
                    }
                } else if (this.state === 'PAUSED') {
                    if (this.inputManager.justPressedActions.pause && !this.uiManager.optionsOpen) {
                        this.changeState('PLAYING');
                    }
                }

                this.audioEngine.updateMusic();
            }

            draw(ctx) {
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

                if (this.state === 'PLAYING' || this.state === 'PAUSED' || this.state === 'GAME_OVER') {
                    ctx.save();
                    if (this.shakeTime > 0) {
                        const dx = (Math.random() - 0.5) * 20 * this.shakeIntensity;
                        const dy = (Math.random() - 0.5) * 20 * this.shakeIntensity;
                        ctx.translate(dx, dy);
                    }

                    this.levelManager.drawScraps(ctx);

                    for (let enemy of this.enemies) {
                        enemy.draw(ctx);
                    }

                    if (this.player) {
                        this.player.draw(ctx);
                    }

                    ctx.restore();

                    this.uiManager.drawHUD(ctx, this.player, this.levelManager);
                }

                this.uiManager.drawTouchControls();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const engine = new GameEngine();
            engine.start();
        });
    </script>
</body>
</html>
