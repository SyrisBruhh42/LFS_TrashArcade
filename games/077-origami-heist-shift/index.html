<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Origami Heist Shift</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #2b2b2b;
      touch-action: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      /* Max size while keeping aspect ratio handled by JS but fallback */
      max-width: 100%;
      max-height: 100%;
    }
  </style>
  <script defer src="./world.js"></script>
  <script defer src="./enemies.js"></script>
  <script defer src="./bosses.js"></script>
  <script defer src="./progression.js"></script>
  <script defer src="./vfx.js"></script>
  <script defer src="./audio.js"></script>
  <script defer src="./game.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
</body>
</html>
