<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandstorm Echo Coop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            touch-action: none;
            font-family: monospace;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .screen {
            display: none;
            text-align: center;
            color: #c6f8c8;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border: 2px solid #c6f8c8;
            border-radius: 10px;
            pointer-events: auto;
        }
        .screen.active {
            display: block;
        }
        h1 { margin-top: 0; }
        button {
            background: #c6f8c8;
            color: #111;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-family: monospace;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover { background: #fff; }
        a { color: #c6f8c8; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="uiLayer">
        <div id="titleScreen" class="screen active">
            <h1>Sandstorm Echo Coop</h1>
            <p>Cooperate with your past self.</p>
            <p>WASD/Arrows to move.</p>
            <button id="btnPlay">PLAY</button>
            <a href="../../index.html">Back to Arcade</a>
        </div>
        <div id="pauseScreen" class="screen">
            <h1>PAUSED</h1>
            <button id="btnResume">RESUME</button>
            <a href="../../index.html">Back to Arcade</a>
        </div>
        <div id="gameOverScreen" class="screen">
            <h1>GAME OVER</h1>
            <p>Score: <span id="finalScore"></span></p>
            <button id="btnRestart">RESTART</button>
            <a href="../../index.html">Back to Arcade</a>
        </div>
    </div>
    <script src="game.js"></script>
    <script src="bosses.js"></script>
</body>
</html>
