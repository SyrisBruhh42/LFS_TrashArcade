<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Forge Fusion</title>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #154743; overflow: hidden; touch-action: none; font-family: monospace; }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        button { position: fixed; z-index: 1; right: max(12px, env(safe-area-inset-right)); min-height: 48px; min-width: 96px; padding: 10px 16px; border: 2px solid #1de9b6; border-radius: 12px; background: #0b2624; color: #fff; font: bold 16px monospace; touch-action: manipulation; cursor: pointer; }
        #pause-button { bottom: max(88px, calc(env(safe-area-inset-bottom) + 88px)); }
        #dash-button { bottom: max(16px, calc(env(safe-area-inset-bottom) + 16px)); min-height: 60px; }
        #options-button { top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }
        button:disabled { color: #888; border-color: #555; cursor: default; }
        button:focus-visible, #gameCanvas:focus-visible { outline: 3px solid #00ffff; outline-offset: -4px; }
        [hidden] { display: none !important; }

        #options-modal {
            display: none; position: fixed; top: 10%; left: 10%; width: 80%; height: 80%;
            background: rgba(11, 38, 36, 0.95); border: 2px solid #1de9b6; border-radius: 12px; z-index: 10;
            color: #fff; padding: 20px; box-sizing: border-box; font-family: monospace; overflow-y: auto;
        }
        .modal-tabs { display: flex; border-bottom: 2px solid #1de9b6; margin-bottom: 10px; }
        .modal-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; background: #154743; border: 1px solid #1de9b6; }
        .modal-tab.active { background: #1de9b6; color: #0b2624; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .close-modal { display: block; margin: 20px auto 0; padding: 10px 20px; background: #ff4081; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
    <script defer src="audio.js"></script>

    <script defer src="world.js"></script>
    <script defer src="vfx.js"></script>
    <script defer src="game.js"></script>
</head>
<body>

    <canvas id="gameCanvas" tabindex="0" aria-label="Echo Forge Fusion. Press Space to start. Move with WASD or arrows, or hold and drag on the arena. Blasts fire on the beat. Shift to dash. Escape to pause or resume."></canvas>
    <button id="options-button" type="button" onclick="document.getElementById('options-modal').style.display='block'">Options</button>
    <button id="pause-button" type="button" hidden>Pause</button>
    <button id="dash-button" type="button" hidden>Dash</button>

    <div id="options-modal">
        <h2 style="text-align:center; color:#1de9b6; margin-top:0;">Options</h2>
        <div class="modal-tabs">
            <div class="modal-tab active" onclick="switchTab('audio')">Audio & Comfort</div>
            <div class="modal-tab" onclick="switchTab('controls')">Controls & Handedness</div>
            <div class="modal-tab" onclick="switchTab('save')">Data</div>
        </div>
        <div id="tab-audio" class="tab-content active">
            <p><label><input type="checkbox" checked> Master Volume</label></p>
            <p><label><input type="checkbox" checked> Screen Shake</label></p>
        </div>
        <div id="tab-controls" class="tab-content">
            <p>WASD / Arrows to Move</p>
            <p>Shift to Dash</p>
            <p>Mouse/Touch to Aim</p>
        </div>
        <div id="tab-save" class="tab-content">
            <details>
                <summary>Manage Save Data</summary>
                <p>Click below to wipe your local high score and progress.</p>
                <button onclick="localStorage.removeItem('arcade_game_084_084-echo-forge-fusion_v1'); alert('Save wiped!');">Reset Save</button>
            </details>
        </div>
        <button class="close-modal" onclick="document.getElementById('options-modal').style.display='none'">Close</button>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(event && event.target) { event.target.classList.add('active'); } else { document.querySelector(`.modal-tab[onclick*="'${tabId}'"]`).classList.add('active'); }
            document.getElementById('tab-' + tabId).classList.add('active');
        }
    </script>
</body>

</html>
