<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dune Ammo Scramble</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: #d4a373;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            pointer-events: auto;
        }
        .screen.active {
            display: flex;
        }
        h1 { margin: 0 0 20px 0; color: #fdc2b9; text-shadow: 2px 2px 0 #000; font-size: 3em; text-align: center; }
        h2 { margin: 0 0 20px 0; color: #fff; text-shadow: 1px 1px 0 #000; }
        button {
            background: #fdc2b9;
            color: #000;
            border: 2px solid #000;
            padding: 15px 30px;
            font-size: 1.2em;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            text-transform: uppercase;
        }
        button:hover {
            background: #fff;
        }
        .arcade-link {
            position: absolute;
            bottom: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 1.2em;
            pointer-events: auto;
        }
        .arcade-link:hover {
            text-decoration: underline;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="hud">
                <div id="score-display">Score: 0</div>
                <div id="ammo-display">Ammo: 10</div>
                <div id="dash-display" style="margin-left: 20px;">Dash: READY</div>
                <div id="wave-display" style="margin-left: 20px;">Wave: 1</div>
            </div>

            <div id="title-screen" class="screen active">
                <h1>Dune Ammo Scramble</h1>
                <p>Limited Ammo Must Be Physically Retrieved</p>
                <button id="btn-start">Start Game</button>
                <button id="btn-settings">Settings</button>
                <button id="btn-milestones">Milestones</button>
                <a href="../../index.html" class="arcade-link">Back to Arcade</a>
            </div>

            <div id="settings-screen" class="screen">
                <h2>SETTINGS</h2>
                <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
                    <label><input type="checkbox" id="chk-mute"> Master Mute</label>
                    <label>SFX Vol: <input type="range" id="sld-sfx" min="0" max="1" step="0.1"></label>
                    <label>Music Vol: <input type="range" id="sld-music" min="0" max="1" step="0.1"></label>
                    <label>Screen Shake:
                        <select id="sel-shake">
                            <option value="1">100%</option>
                            <option value="0.5">50%</option>
                            <option value="0">Off</option>
                        </select>
                    </label>
                    <label>Particles:
                        <select id="sel-particles">
                            <option value="high">High</option>
                            <option value="low">Low</option>
                        </select>
                    </label>
                    <label><input type="checkbox" id="chk-colorblind"> High-Contrast Mode</label>
                    <label><input type="checkbox" id="chk-fps"> Show FPS</label>
                    <label>Touch Controls:
                        <select id="sel-touch">
                            <option value="auto">Auto</option>
                            <option value="always">Always</option>
                            <option value="off">Off</option>
                        </select>
                    </label>
                    <label><input type="checkbox" id="chk-touch-swap"> Swap L/R Touch Controls</label>
                    <button id="btn-export-save">Export Save</button>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="inp-import-save" placeholder="Paste Base64 Save">
                        <button id="btn-import-save">Import Save</button>
                    </div>
                    <button id="btn-reset-save">Reset Save (Click 2x)</button>
                </div>
                <button id="btn-close-settings">Back</button>
            </div>

            <div id="milestones-screen" class="screen">
                <h2>MILESTONES</h2>
                <div id="milestones-list" style="display:flex; flex-direction:column; gap:10px; max-height:400px; overflow-y:auto; padding:20px; width:80%;"></div>
                <button id="btn-close-milestones">Back</button>
            </div>

            <div id="fps-display" style="position:absolute; top:20px; right:20px; font-size:1.5em; font-weight:bold; display:none; pointer-events:none; text-shadow:1px 1px 0 #000;">FPS: 0</div>

            <div id="touch-controls" style="display:none; position:absolute; bottom:20px; width:100%; justify-content:space-between; padding:0 20px; box-sizing:border-box; pointer-events:none; z-index:100;">
                <div id="joystick-area" style="width:150px; height:150px; background:rgba(255,255,255,0.2); border-radius:50%; position:relative; pointer-events:auto;">
                    <div id="joystick-knob" style="width:50px; height:50px; background:rgba(255,255,255,0.5); border-radius:50%; position:absolute; top:50px; left:50px; pointer-events:none;"></div>
                </div>
                <div id="action-buttons-area" style="display:flex; gap:20px; pointer-events:auto; align-items:center;">
                    <button id="btn-touch-dash" style="width:80px; height:80px; border-radius:50%; font-size:1em; margin:0; pointer-events:auto;">DASH</button>
                </div>
            </div>

            <div id="pause-screen" class="screen">
                <h2>PAUSED</h2>
                <button id="btn-resume">Resume</button>
                <a href="../../index.html" class="arcade-link">Back to Arcade</a>
            </div>

            <div id="game-over-screen" class="screen">
                <h2>GAME OVER</h2>
                <p id="final-score">Score: 0</p>
                <p id="high-score">High Score: 0</p>
                <button id="btn-restart">Play Again</button>
                <a href="../../index.html" class="arcade-link">Back to Arcade</a>
            </div>

            <div id="upgrade-screen" class="screen">
                <h2>UPGRADE DRAFT</h2>
                <p>Wave Complete. Choose your perk!</p>
                <div id="upgrade-options" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </div>
    </div>
    <script defer src="./vfx.js"></script>
    <script defer src="./game.js"></script>
    <script defer src="./ui.js"></script>
</body>
</html>
