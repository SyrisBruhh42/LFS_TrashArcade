<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dune Ammo Scramble</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: #d4a373;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            pointer-events: auto;
        }
        .screen.active {
            display: flex;
        }
        h1 { margin: 0 0 20px 0; color: #fdc2b9; text-shadow: 2px 2px 0 #000; font-size: 3em; text-align: center; }
        h2 { margin: 0 0 20px 0; color: #fff; text-shadow: 1px 1px 0 #000; }
        button {
            background: #fdc2b9;
            color: #000;
            border: 2px solid #000;
            padding: 15px 30px;
            font-size: 1.2em;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            text-transform: uppercase;
        }
        button:hover {
            background: #fff;
        }
        .arcade-link {
            position: absolute;
            bottom: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 1.2em;
            pointer-events: auto;
        }
        .arcade-link:hover {
            text-decoration: underline;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="hud">
                <div id="score-display">Score: 0</div>
                <div id="ammo-display">Ammo: 10</div>
                <div id="dash-display" style="margin-left: 20px;">Dash: READY</div>
            </div>

            <div id="title-screen" class="screen active">
                <h1>Dune Ammo Scramble</h1>
                <p>Limited Ammo Must Be Physically Retrieved</p>
                <button id="btn-start">Start Game</button>
                <a href="../../index.html" class="arcade-link">Back to Arcade</a>
            </div>

            <div id="pause-screen" class="screen">
                <h2>PAUSED</h2>
                <button id="btn-resume">Resume</button>
                <a href="../../index.html" class="arcade-link">Back to Arcade</a>
            </div>

            <div id="game-over-screen" class="screen">
                <h2>GAME OVER</h2>
                <p id="final-score">Score: 0</p>
                <p id="high-score">High Score: 0</p>
                <button id="btn-restart">Play Again</button>
                <a href="../../index.html" class="arcade-link">Back to Arcade</a>
            </div>
        </div>
    </div>
    <script defer src="./game.js"></script>
</body>
</html>
