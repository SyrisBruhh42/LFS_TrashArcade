<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trench Tactics</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050a12; color: #cdc3b9; font-family: monospace; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; max-width: 100%; max-height: 100%; box-shadow: 0 0 20px rgba(205, 195, 185, 0.2); }
        .hidden { display: none !important; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud-text { position: absolute; font-size: 16px; color: #cdc3b9; pointer-events: auto; }
        .back-link { position: absolute; top: 10px; left: 10px; color: #cdc3b9; text-decoration: none; border: 1px solid #cdc3b9; padding: 5px 10px; font-weight: bold; background: rgba(0,0,0,0.5); pointer-events: auto; z-index: 1000; }
        #pause-button { position:fixed; right:16px; bottom:16px; z-index:10; min-width:100px; min-height:48px; padding:10px; border:2px solid #cdc3b9; border-radius:8px; background:#050a12; color:#cdc3b9; font:bold 16px monospace; touch-action:manipulation; }
        [hidden] { display:none !important; }
        #pause-button:focus-visible, canvas:focus-visible { outline:3px solid #4a90e2; }
        .back-link:hover { background: #cdc3b9; color: #050a12; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600" tabindex="0" aria-label="Trench Tactics. Enter to start. WASD, arrows or drag to move; tap, click or Space to attack."></canvas>
        <div id="ui-layer">
            <a href="../../index.html" class="back-link" id="back-button">Back to Arcade</a>
        </div>
    </div>
    <button id="pause-button" type="button" hidden>Pause</button>
    <button id="options-button" type="button" style="position:fixed; left:16px; bottom:16px; z-index:10; min-width:100px; min-height:48px; padding:10px; border:2px solid #cdc3b9; border-radius:8px; background:#050a12; color:#cdc3b9; font:bold 16px monospace; touch-action:manipulation;">Options</button>
    <button id="dash-button" type="button" hidden style="position:fixed; right:126px; bottom:16px; z-index:10; min-width:100px; min-height:48px; padding:10px; border:2px solid #cdc3b9; border-radius:8px; background:#050a12; color:#cdc3b9; font:bold 16px monospace; touch-action:manipulation;">Dash</button>

    <div id="options-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:400px; max-width:90%; background:rgba(5, 10, 18, 0.95); border:2px solid #cdc3b9; border-radius:8px; padding:20px; z-index:2000; flex-direction:column; gap:10px; font-family:monospace; color:#cdc3b9;">
        <h2 style="margin-top:0; text-align:center;">OPTIONS</h2>
        <div style="display:flex; border-bottom:1px solid #cdc3b9; margin-bottom:10px;">
            <button type="button" id="tab-audio" style="flex:1; background:#cdc3b9; color:#050a12; border:none; padding:5px; font-weight:bold; cursor:pointer;">Audio</button>
            <button type="button" id="tab-controls" style="flex:1; background:transparent; color:#cdc3b9; border:none; padding:5px; cursor:pointer;">Controls</button>
            <button type="button" id="tab-save" style="flex:1; background:transparent; color:#cdc3b9; border:none; padding:5px; cursor:pointer;">Save</button>
        </div>
        <div id="panel-audio" style="display:block;">
            <label style="display:flex; align-items:center; gap:10px;">Volume: <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="1" style="flex:1;"></label>
        </div>
        <div id="panel-controls" style="display:none; line-height:1.5;">
            <p style="margin:5px 0;"><strong>WASD/Arrows/Drag:</strong> Move.</p>
            <p style="margin:5px 0;"><strong>Space/Click/Tap:</strong> Attack.</p>
            <p style="margin:5px 0;"><strong>Shift/Right-Click/Dash:</strong> Dash.</p>
        </div>
        <div id="panel-save" style="display:none;">
            <details>
                <summary style="cursor:pointer;">Manage Save Data</summary>
                <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
                    <button type="button" id="btn-export" style="padding:8px; cursor:pointer; background:#2c3e50; color:#cdc3b9; border:1px solid #cdc3b9;">Copy to Clipboard</button>
                    <button type="button" id="btn-import" style="padding:8px; cursor:pointer; background:#2c3e50; color:#cdc3b9; border:1px solid #cdc3b9;">Import from Clipboard</button>
                    <button type="button" id="btn-reset" style="padding:8px; cursor:pointer; background:#c0392b; color:#fff; border:none;">Reset Save</button>
                </div>
            </details>
        </div>
        <button type="button" id="btn-close-options" style="margin-top:20px; padding:10px; background:#cdc3b9; color:#050a12; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Close</button>
    </div>

    <script src="game.js"></script>
    <script defer src="player.js"></script>
    <script defer src="world.js"></script>
    <script defer src="enemies.js"></script>
</body>
</html>
