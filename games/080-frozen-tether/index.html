<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frozen Tether</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            outline: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: sans-serif;
            pointer-events: none;
        }
        a {
            color: #769a87;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .hidden-link {
            display: none;
        }
    </style>
    <script defer src="./world.js"></script>
    <script defer src="./progression.js"></script>
    <script defer src="./vfx.js"></script>
    <script defer src="./game.js"></script>
</head>
<body>
    <!-- Hidden link for preflight requirement if not drawn on canvas -->
    <a href="../../index.html" class="hidden-link">Back to Arcade</a>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600" tabindex="1"></canvas>
    </div>
</body>
</html>
