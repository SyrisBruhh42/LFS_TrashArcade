name: Autonomous Arcade Factory (15-Min Single Instance)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_dispatch:
        description: 'Force launch a new Jules session even if one is currently active'
        required: false
        default: 'false'
        type: string

concurrency:
  group: lfs-trasharcade-orchestrator
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-next-arcade-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify & Auto-Merge Any Completed Jules PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          node ./scripts/auto_merge_arcade.js
          git pull --rebase origin main || true

      - name: Verify Current Main Branch Integrity
        run: |
          node ./scripts/verify.js

      - name: Single-Instance Concurrency & Stall Guard
        id: guard
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          FORCE_DISPATCH: ${{ inputs.force_dispatch || 'false' }}
        run: |
          node ./scripts/jules_session_guard.js

      - name: Launch Single Jules Session (Start & Auto-Merge Pipeline)
        if: steps.guard.outputs.should_dispatch == 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STARTING_BRANCH: main
        run: |
          node ./scripts/jules_invoke.js
